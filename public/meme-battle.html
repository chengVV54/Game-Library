<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>VS 表情包对战模拟器</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#222;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:10px;
            color:#fff;
            font-family:system-ui;
        }
        #topBar{
            font-size:24px;
            margin-bottom:8px;
            font-weight:bold;
        }
        canvas{
            border:2px solid #444;
            background:#3498db;
            border-radius:8px;
        }
        .tip{
            margin-top:8px;
            font-size:13px;
            color:#aaa;
        }
    </style>
</head>
<body>

    <div id="topBar">??? VS ???</div>

    <div id="selectArea" style="display:flex; gap:30px; margin-bottom:10px;">
        <!-- 左侧：A队选择 -->
        <div style="
            background:#1a1a2e;
            border:2px solid #3498db;
            border-radius:8px;
            padding:15px;
            width:220px;
            text-align:center;
        ">
            <div style="color:#3498db; font-size:18px; font-weight:bold; margin-bottom:10px;">左边队伍 P1</div>
            <div id="leftChoices" style="display:flex; flex-direction:column; gap:8px;">
                <div onclick="selectTeam('A', '大狗嚼', this)" style="
                    background:#3498db;
                    border-radius:6px;
                    padding:10px;
                    cursor:pointer;
                    color:#fff;
                    font-weight:bold;
                ">🐶 大狗嚼</div>
                <div onclick="selectTeam('A', '哈基米', this)" style="
                    background:#3498db;
                    border-radius:6px;
                    padding:10px;
                    cursor:pointer;
                    color:#fff;
                    font-weight:bold;
                ">🐱 哈基米</div>
            </div>
        </div>

        <!-- 右侧：B队选择 -->
        <div style="
            background:#1a1a2e;
            border:2px solid #e74c3c;
            border-radius:8px;
            padding:15px;
            width:220px;
            text-align:center;
        ">
            <div style="color:#e74c3c; font-size:18px; font-weight:bold; margin-bottom:10px;">右边队伍 P2</div>
            <div id="rightChoices" style="display:flex; flex-direction:column; gap:8px;">
                <div onclick="selectTeam('B', '大狗嚼', this)" style="
                    background:#e74c3c;
                    border-radius:6px;
                    padding:10px;
                    cursor:pointer;
                    color:#fff;
                    font-weight:bold;
                ">🐶 大狗嚼</div>
                <div onclick="selectTeam('B', '哈基米', this)" style="
                    background:#e74c3c;
                    border-radius:6px;
                    padding:10px;
                    cursor:pointer;
                    color:#fff;
                    font-weight:bold;
                ">🐱 哈基米</div>
            </div>
        </div>
    </div>

    <button id="startBtn" style="
        padding: 12px 24px;
        font-size: 18px;
        background: #fff;
        color: #222;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 10px;
        font-weight: bold;
    ">⚔️ 开始对决</button>    
    <canvas id="gameCanvas" width="630" height="720"></canvas>
    <div class="tip">自动战斗开始！录制即可制作抖音meme视频</div>

<script>
// ======================【角色数据库】======================
const ROLE_DATABASE = {
    '大狗嚼': {
        normalImg: "/assets/dog-1.png",
        attackImg: "/assets/dog-2.png",
        evolve1NormalImg: "/assets/reddog-1.png",
        evolve1AttackImg: "/assets/reddog-2.png",
        evolve2NormalImg: "/assets/bluedog-1.png",
        evolve2AttackImg: "/assets/bluedog-2.png",
        hp: 300,
        speed: 1.8,
        attackRange: 100,
        displayAttackRange: 150,
        damage: 25
    },
    '哈基米': {
        normalImg: "/assets/cat-1.png",
        attackImg: "/assets/cat-1.png",
        hp: 280,
        speed: 1.9,
        attackRange: 95,
        displayAttackRange: 0,
        damage: 20
    }
};
// ====================================================

const SPRITE_SIZE = 110;

// ======================【选择系统】======================
let selectedA = null;
let selectedB = null;

function selectTeam(team, name, element){
    if(team === 'A'){
        selectedA = name;
        document.querySelectorAll('#leftChoices div').forEach(el => {
            el.style.opacity = '0.4';
            el.style.border = 'none';
        });
        element.style.opacity = '1';
        element.style.border = '3px solid #fff';
    } else {
        selectedB = name;
        document.querySelectorAll('#rightChoices div').forEach(el => {
            el.style.opacity = '0.4';
            el.style.border = 'none';
        });
        element.style.opacity = '1';
        element.style.border = '3px solid #fff';
    }
    updateTopBar();
}

function updateTopBar(){
    const nameA = selectedA || "???";
    const nameB = selectedB || "???";
    document.getElementById("topBar").innerText = `${nameA}  VS  ${nameB}`;
}
// ====================================================

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
updateTopBar();

class Fighter {
    constructor(config, team){
        this.team = team;
        this.teamLabel = team === 'A' ? 'P1' : 'P2';
        this.maxHp = config.hp;
        this.hp = config.hp;
        this.speed = config.speed;
        this.attackRange = config.attackRange;
        this.displayAttackRange = config.displayAttackRange || 0;
        this.damage = config.damage;
        this.alive = true;

        this.normalImg = new Image();
        this.normalImg.crossOrigin = "anonymous";
        this.normalImg.src = config.normalImg;

        this.attackImg = new Image();
        this.attackImg.crossOrigin = "anonymous";
        this.attackImg.src = config.attackImg;

        // 进化图
        this.evolve1NormalImg = config.evolve1NormalImg ? new Image() : null;
        if(this.evolve1NormalImg){
            this.evolve1NormalImg.crossOrigin = "anonymous";
            this.evolve1NormalImg.src = config.evolve1NormalImg;
        }
        this.evolve1AttackImg = config.evolve1AttackImg ? new Image() : null;
        if(this.evolve1AttackImg){
            this.evolve1AttackImg.crossOrigin = "anonymous";
            this.evolve1AttackImg.src = config.evolve1AttackImg;
        }
        this.evolve2NormalImg = config.evolve2NormalImg ? new Image() : null;
        if(this.evolve2NormalImg){
            this.evolve2NormalImg.crossOrigin = "anonymous";
            this.evolve2NormalImg.src = config.evolve2NormalImg;
        }
        this.evolve2AttackImg = config.evolve2AttackImg ? new Image() : null;
        if(this.evolve2AttackImg){
            this.evolve2AttackImg.crossOrigin = "anonymous";
            this.evolve2AttackImg.src = config.evolve2AttackImg;
        }

        this.img = this.normalImg;

        this.x = Math.random() * (canvas.width - SPRITE_SIZE);
        this.y = Math.random() * (canvas.height - SPRITE_SIZE);

        this.vx = (Math.random() - 0.5) * 2 * this.speed;
        this.vy = (Math.random() - 0.5) * 2 * this.speed;
        this.pauseFrames = 0;
        this.attackDisplayFrames = 0;
        this.attackImageFrames = 0;
        this.attackCount = 0;
        this.evolveStage = 0;   // 0=初始, 1=第一形态, 2=第二形态
        this.damageTexts = [];
    }

    update(){
        if(!this.alive) return;
        
        if(this.pauseFrames > 0){
            this.pauseFrames--;
            return;
        }

        if(this.attackDisplayFrames > 0){
            this.attackDisplayFrames--;
            this.img = this.attackImg;
        }

        if(this.attackImageFrames > 0){
            this.attackImageFrames--;
            this.img = this.attackImg;
        }
        
        this.x += this.vx;
        this.y += this.vy;

        if(this.x <= 0 || this.x + SPRITE_SIZE >= canvas.width){
            this.vx *= -1;
        }
        if(this.y <= 0 || this.y + SPRITE_SIZE >= canvas.height){
            this.vy *= -1;
        }

        this.x = Math.max(0, Math.min(canvas.width - SPRITE_SIZE, this.x));
        this.y = Math.max(0, Math.min(canvas.height - SPRITE_SIZE, this.y));
    }

    draw(){
        if(this.alive){
            ctx.drawImage(this.img, this.x, this.y, SPRITE_SIZE, SPRITE_SIZE);
            this.drawTeamLabel();
            this.drawHpBar();
        }
        this.drawDamageTexts();
    }

    drawTeamLabel(){
        const px = this.x + SPRITE_SIZE/2;
        const py = this.y - 10;
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(this.teamLabel, px, py);
    }

    drawHpBar(){
        const barW = 90;
        const barH = 24;
        const crossLen = 80;
        const crossW = 28;
        
        const px = this.x + SPRITE_SIZE/2;
        
        const centerY = this.y + SPRITE_SIZE/2;
        const isUpperHalf = centerY < canvas.height / 2;
        
        const barY = isUpperHalf 
            ? this.y + SPRITE_SIZE + 10
            : this.y - 90;
        
        const hpRatio = Math.max(0, this.hp / this.maxHp);
        
        ctx.fillStyle = "#222";
        ctx.fillRect(px - barW/2, barY - barH/2, barW, barH);
        
        const verticalWhiteTop = barY + crossLen/2 - crossLen * hpRatio;
        const horizontalBarTop = barY - barH/2;
        
        let horizontalWhiteHeight;
        
        if (verticalWhiteTop <= horizontalBarTop) {
            horizontalWhiteHeight = barH;
        } else if (verticalWhiteTop >= horizontalBarTop + barH) {
            horizontalWhiteHeight = 0;
        } else {
            horizontalWhiteHeight = (horizontalBarTop + barH) - verticalWhiteTop;
        }
        
        if (horizontalWhiteHeight > 0) {
            ctx.fillStyle = "#fff";
            ctx.fillRect(
                px - barW/2,
                barY + barH/2 - horizontalWhiteHeight,
                barW,
                horizontalWhiteHeight
            );
        }
        
        ctx.fillStyle = "#222";
        ctx.fillRect(px - crossW/2, barY - crossLen/2, crossW, crossLen);
        
        ctx.fillStyle = "#fff";
        ctx.fillRect(
            px - crossW/2,
            barY + crossLen/2 - crossLen * hpRatio,
            crossW,
            crossLen * hpRatio
        );
        
        ctx.fillStyle = "#000";
        ctx.font = "bold 12px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(`${Math.ceil(this.hp)}`, px, barY + 4);
    }
    
    drawDamageTexts(){
        for(let i = this.damageTexts.length - 1; i >= 0; i--){
            const dt = this.damageTexts[i];
            
            dt.y -= 1.5;
            dt.frames--;
            
            const alpha = dt.frames / 40;
            
            ctx.fillStyle = `rgba(255, 80, 80, ${alpha})`;
            ctx.font = "bold 14px system-ui";
            ctx.textAlign = "center";
            ctx.fillText(dt.text, dt.x, dt.y);
            
            if(dt.frames <= 0){
                this.damageTexts.splice(i, 1);
            }
        }
    }

    takeDamage(dmg){
        if(!this.alive) return;
        this.hp -= dmg;
        
        this.damageTexts.push({
            text: `- ${dmg} 血量`,
            x: this.x + SPRITE_SIZE/2,
            y: this.y - 20,
            frames: 40
        });
        
        if(this.hp <= 0){
            this.hp = 0;
            this.alive = false;
        }
    }

    getCenter(){
        return {
            x: this.x + SPRITE_SIZE/2,
            y: this.y + SPRITE_SIZE/2
        };
    }
}

let fighters = [];

function initFighters(){
    fighters = [];
    const configA = ROLE_DATABASE[selectedA];
    const configB = ROLE_DATABASE[selectedB];
    fighters.push(new Fighter(configA, "A"));
    fighters.push(new Fighter(configB, "B"));
}

function gameLoop(){
    ctx.fillStyle = "#3498db";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    fighters.forEach(f => f.update());

    fighters.forEach(f => {
        f.img = f.normalImg;
    });

    for(let a of fighters){
        if(!a.alive) continue;
        for(let b of fighters){
            if(!b.alive) continue;
            if(a.team === b.team) continue;

            const p1 = a.getCenter();
            const p2 = b.getCenter();
            const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);

            if(a.displayAttackRange && dist < a.displayAttackRange){
                a.img = a.attackImg;
                a.attackImageFrames = 60;
            }

            if(dist < a.attackRange){
                let actualDamage = a.damage;
                
                a.attackCount++;
                
                // 进化判断
                if(a.attackCount >= 5 && a.evolveStage === 0){
                    a.evolveStage = 1;
                    a.normalImg = a.evolve1NormalImg || a.normalImg;
                    a.attackImg = a.evolve1AttackImg || a.attackImg;
                    a.img = a.normalImg;
                    a.attackCount = 0;
                    actualDamage = a.damage * 1.5;
                } else if(a.attackCount >= 5 && a.evolveStage === 1 && a.evolve2NormalImg){
                    a.evolveStage = 2;
                    a.normalImg = a.evolve2NormalImg;
                    a.attackImg = a.evolve2AttackImg || a.evolve2NormalImg;
                    a.img = a.normalImg;
                    a.attackCount = 0;
                    actualDamage = a.damage * 2.5;
                }
                
                b.takeDamage(actualDamage);

                a.img = a.attackImg;

                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distance = Math.max(1, dist);
                const nx = dx / distance;
                const ny = dy / distance;

                a.x -= nx * 5;
                a.y -= ny * 5;
                b.x += nx * 5;
                b.y += ny * 5;

                a.vx = -nx * a.speed;
                a.vy = -ny * a.speed;
                b.vx = nx * b.speed;
                b.vy = ny * b.speed;

                a.pauseFrames = 60;
                b.pauseFrames = 60;

                a.attackDisplayFrames = 30;
                b.attackDisplayFrames = 30;
            }
        }
    }

    fighters.forEach(f => f.draw());

    const aliveA = fighters.filter(f => f.team === "A" && f.alive).length;
    const aliveB = fighters.filter(f => f.team === "B" && f.alive).length;

    if(aliveA === 0 || aliveB === 0){
        requestAnimationFrame(gameLoop);
        return;
    }

    requestAnimationFrame(gameLoop);
}

document.getElementById("startBtn").addEventListener("click", () => {
    if(!selectedA || !selectedB){
        alert("请先选择两个队伍！");
        return;
    }
    initFighters();
    document.getElementById("selectArea").style.display = "none";
    document.getElementById("startBtn").style.display = "none";
    requestAnimationFrame(gameLoop);
});
</script>
</body>
</html>
